[workspace]
resolver = "2"
members = ["crates/quantparity", "crates/quantparity-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/secke/quantparity"
authors = ["secke"]
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
